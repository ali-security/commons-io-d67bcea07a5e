name: Java CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Maven test selector arguments, e.g. -Dtest=FooTest -DfailIfNoTests=false'
        required: false
        default: ''

jobs:
  build:

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [ 8, 11, 14 ]
        experimental: [false]
        include:
          - java: 15-ea
            os: ubuntu-latest
            experimental: true        
          - java: 15-ea
            os: windows-latest
            experimental: true        
      fail-fast: false
        
    steps:
    - uses: actions/checkout@v2.3.2
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v2
      with:
        distribution: 'adopt'
        java-version: ${{ matrix.java }}
    - name: Build with Maven
      run: mvn -V --file pom.xml --no-transfer-progress -DtrimStackTrace=false "-Drat.skip=true" ${{ inputs.test-filter }}
    - name: Report skipped tests
      if: always()
      shell: bash
      run: sed -n '/<testcase/h; /<skipped/{x;p;x;p}' target/surefire-reports/TEST-*.xml
    - name: Upload Maven build artifacts
      if: success() && matrix.os == 'ubuntu-latest' && matrix.java == 8
      uses: actions/upload-artifact@v4
      with:
        name: built-jars
        path: target/*.jar
        if-no-files-found: error
